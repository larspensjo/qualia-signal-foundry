[package]
name = "qsf_app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
openai = [
  "dep:base64",
  "dep:cpal",
  "dep:futures-util",
  "dep:openai_provider_kit",
  "dep:reqwest",
  "dep:tokio",
  "dep:tokio-tungstenite",
]

[dependencies]
anyhow.workspace = true
base64 = { workspace = true, optional = true }
clap.workspace = true
cpal = { workspace = true, optional = true }
engine_logging = { path = "../engine_logging" }
futures-util = { workspace = true, optional = true }
hound.workspace = true
log.workspace = true
openai_provider_kit = { git = "https://github.com/larspensjo/web_page_filet_mignon", package = "openai_provider_kit", rev = "ca28629d42fb350a7935df6907573e2f972b3ba9", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
uuid.workspace = true
