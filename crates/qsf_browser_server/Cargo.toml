[package]
name = "qsf_browser_server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[features]
default = []
embedded-frontend = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
anyhow = { workspace = true }
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["query"] }
clap = { workspace = true }
engine_logging = { path = "../engine_logging" }
log = { workspace = true }
qsf_memory = { path = "../qsf_memory" }
serde = { workspace = true }
serde_json = { workspace = true }
# Predeclared for Phase 2 query/error/time surfaces; keep Rust-only builds independent of npm.
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = [
    "net",
    "rt-multi-thread",
    "macros",
    "signal",
    "time",
] }
tower = "0.5"
mime_guess = { version = "2", optional = true }
rust-embed = { version = "8", features = ["mime-guess"], optional = true }

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
