[package]
name = "qsf_realtime_server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
axum = { version = "0.8", features = ["ws"] }
clap.workspace = true
engine_logging = { path = "../engine_logging" }
futures-util.workspace = true
log.workspace = true
qsf_context = { path = "../qsf_context" }
qsf_corpus = { path = "../qsf_corpus" }
qsf_diagnostics = { path = "../qsf_diagnostics" }
qsf_memory = { path = "../qsf_memory" }
qsf_models = { path = "../qsf_models" }
qsf_session = { path = "../qsf_session" }
qsf_realtime_protocol = { path = "../qsf_realtime_protocol" }
qsf_tools = { path = "../qsf_tools" }
qsf_volition = { path = "../qsf_volition" }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["macros", "signal", "sync"] }
tokio-tungstenite.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
tower = "0.5"
