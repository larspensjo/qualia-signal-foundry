[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Lars Pensjö"]
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
cpal = "0.17.3"
futures-util = "0.3"
hound = "3.5"
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
